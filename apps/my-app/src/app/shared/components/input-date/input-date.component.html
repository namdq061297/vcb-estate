<tui-loader
  class="inline-flex tui-space_right-2"
  [loading]="loading"
  [inheritColor]="true"
  [overlay]="true"
>
  <tui-textfield [disabledControl]='disabledControl' (click)='onClick()'>
    <label tuiLabel>{{ label }} <b *ngIf='required' class='text-red-500'>*</b></label>
    <input tuiInputDate [formControl]="control" [min]='min' [max]='max' [placeholder]='placeholder' />
    <tui-calendar *tuiDropdown [disabledItemHandler]="disableDateHandle" />
  </tui-textfield>
</tui-loader>

<tui-error
  *ngIf='control.touched'
  [formControl]='control'
></tui-error>
