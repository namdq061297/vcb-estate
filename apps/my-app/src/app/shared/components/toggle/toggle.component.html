<button
  type="button"
  class="app-toggle"
  [class.app-toggle--on]="checked()"
  [disabled]="disabled()"
  role="switch"
  [attr.aria-checked]="checked()"
  [attr.aria-label]="ariaLabel()"
  (click)="onToggle()"
>
  <!-- <span class="app-toggle__icon">{{ checked() ? '✓' : '✕' }}</span> -->
  <span class="app-toggle__thumb"></span>
</button>
