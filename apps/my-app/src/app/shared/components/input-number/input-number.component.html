<tui-textfield [disabledControl]='disabledControl'>
  <label tuiLabel>{{ label }} <b *ngIf='required' class='text-red-500'>*</b></label>
  <input
    tuiInputNumber
    [formControl]="control"
    (ngModelChange)="onValueChange($event)"
    [max]="max"
    [min]="min"
    [postfix]="postfix"
    [placeholder]="placeholder"
  />
</tui-textfield>

<tui-error
  *ngIf='control.touched'
  [formControl]='control'
></tui-error>
