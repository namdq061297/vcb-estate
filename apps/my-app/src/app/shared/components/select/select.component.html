<tui-loader
  class="inline-flex tui-space_right-2"
  [loading]="loading"
  [inheritColor]="true"
  [overlay]="true"
>
  <tui-textfield tuiChevron [disabledControl]='disabledControl' [content]='stringify(items)'>
    <label tuiLabel>{{ label }} <b *ngIf='required' class='text-red-500'>*</b></label>
    <input [placeholder]="placeholder" tuiSelect [formControl]='control' />
    <ng-template tuiDataList>
      <tui-data-list>
        <button
          *ngFor="let item of items"
          tuiOption
          [value]="item.value"
        >
          {{ item.label }}
        </button>
      </tui-data-list>
    </ng-template>
  </tui-textfield>
</tui-loader>

<tui-error
  *ngIf='control.touched'
  [formControl]='control'
></tui-error>
