<label [tuiLabel]='tmpLabel'>
  <tui-input-number
    [formControl]="control"
    [disabledControl]='disabledControl'
    [tuiTextfieldLabelOutside]='true'
    [tuiTextfieldPostfix]="postfix"
    decimal='never'
    [max]="max"
    [min]="min"
    (ngModelChange)="onValueChange($event)"
  >
    {{ placeholder }}
  </tui-input-number>

  <tui-error
    *ngIf='control.touched'
    [formControl]='control'
    [error]="[] | tuiFieldError | async"
  ></tui-error>
</label>

<ng-template #tmpLabel>
  {{ label }} <b *ngIf='required' class='text-red-500'>*</b>
</ng-template>
