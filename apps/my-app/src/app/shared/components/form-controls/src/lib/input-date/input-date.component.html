<label [tuiLabel]='tmpLabel'>
  <tui-loader
    class="inline-flex tui-space_right-2"
    [showLoader]="loading"
    [inheritColor]="true"
    [overlay]="true"
  >
    <tui-input-date
      toNativeDate
      [formControl]="control"
      [disabledControl]='disabledControl'
      [tuiTextfieldLabelOutside]='true'
      [min]='min'
      [max]='max'
      [disabledItemHandler]='disableDateHandle'
      (click)='onClick()'
    >
      {{ placeholder }}
    </tui-input-date>
  </tui-loader>

  <tui-error
    *ngIf='control.touched'
    [formControl]='control'
    [error]="[] | tuiFieldError | async"
  ></tui-error>
</label>

<ng-template #tmpLabel>
  {{ label }} <b *ngIf='required' class='text-red-500'>*</b>
</ng-template>
