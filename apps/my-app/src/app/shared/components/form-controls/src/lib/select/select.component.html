<label [tuiLabel]='tmpLabel'>
  <tui-loader
    class="inline-flex tui-space_right-2"
    [showLoader]="loading"
    [inheritColor]="true"
    [overlay]="true"
  >
    <tui-select
      [formControl]='control'
      [disabledControl]='disabledControl'
      [tuiTextfieldLabelOutside]='true'
      [valueContent]='stringify(items)'
    >
      {{ placeholder }}
      <ng-template tuiDataList>
        <tui-data-list>
          <button
            *ngFor="let item of items"
            tuiOption
            [value]="item.value"
          >
            {{ item.label }}
          </button>
        </tui-data-list>
      </ng-template>
    </tui-select>
  </tui-loader>

  <tui-error
    *ngIf='control.touched'
    [formControl]='control'
    [error]="[] | tuiFieldError | async"
  ></tui-error>
</label>

<ng-template #tmpLabel>
  {{ label }} <b *ngIf='required' class='text-red-500'>*</b>
</ng-template>
