<label [tuiLabel]='tmpLabel'>
  <tui-loader
    class="inline-flex tui-space_right-2"
    [showLoader]="loading"
    [inheritColor]="true"
    [overlay]="true"
  >
    <tui-combo-box
      [formControl]='searchControl'
      [disabledControl]='disabledControl'
      [tuiTextfieldLabelOutside]='true'
      (searchChange)="searchChange($event)"
    >
      {{ placeholder }}
      <ng-container *tuiDataList>
        <cdk-virtual-scroll-viewport
          *tuiLet="options | tuiFilterByInput: matcher as opts"
          tuiScrollable
          class="scroll"
          [style.height.px]="opts.length * 44"
          [itemSize]="44"
          (scrolledIndexChange)="list.handleFocusLossIfNecessary()"
        >
          <tui-data-list #list>
            <button
              *cdkVirtualFor="let opt of opts"
              tuiOption
              [value]="opt"
            >
              {{ opt }}
            </button>
          </tui-data-list>
        </cdk-virtual-scroll-viewport>
      </ng-container>
    </tui-combo-box>
  </tui-loader>

  <tui-error
    *ngIf='control.touched'
    [formControl]='control'
    [error]="[] | tuiFieldError | async"
  ></tui-error>
</label>

<ng-template #itemContent let-item>
  {{ item.label }}
</ng-template>

<ng-template #tmpLabel>
  {{ label }} <b *ngIf='required' class='text-red-500'>*</b>
</ng-template>
